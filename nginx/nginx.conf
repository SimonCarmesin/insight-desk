events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    gzip          on;
    gzip_types    text/plain application/json application/javascript text/css;

    # Grundhaertung: keine Nginx-Version nach aussen zeigen, Request-Groesse begrenzen
    server_tokens off;
    client_max_body_size 5m;

    # Rate Limiting: max. 10 Requests/Sekunde pro Client-IP, kurze Bursts erlaubt
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Interne Ziele ueber die Docker-Compose-Service-Namen (DNS im internen Netzwerk)
    upstream ticket_service {
        server ticket-service:8080;
    }
    upstream user_service {
        server user-service:8081;
    }
    upstream intake_service {
        server intake-service:8082;
    }
    upstream frontend {
        server frontend-service:80;
    }

    server {
        listen 80;
        server_name _;

        # Ein paar Standard-Security-Header
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --- API Gateway: Routing zu den einzelnen Services nach Pfad ---
        #
        # WICHTIG: Die echten Spring-Controller haben KEIN eigenes @RequestMapping-Prefix,
        # jede Methode traegt ihren vollen Pfad direkt (z.B. @PostMapping("/tickets"),
        # @GetMapping("/tickets/{id}")). Das Gateway haengt "/api" nur AUSSEN drauf und
        # muss "/tickets", "/users", "/intake/extract" beim Weiterleiten UNVERAENDERT lassen
        # - es darf also nur "/api" abschneiden, nicht mehr.
        #
        # Deshalb pro Service zwei location-Bloecke:
        #  - "=" (exact match) fuer den nackten Collection-Pfad ohne trailing slash
        #    (z.B. GET/POST /api/tickets)
        #  - Prefix-Block MIT trailing slash fuer alles darunter
        #    (z.B. /api/tickets/5, /api/tickets/5/status, /api/tickets/5/comments)

        # ---- Ticket-Service: /api/tickets(...) -> /tickets(...) ----
        location = /api/tickets {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ticket_service/tickets;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/tickets/ {
            limit_req zone=api_limit burst=20 nodelay;
            # "/api/tickets/" wird durch "/tickets/" ersetzt (nicht komplett entfernt!):
            # Browser ruft /api/tickets/5/comments -> ticket-service bekommt /tickets/5/comments
            proxy_pass http://ticket_service/tickets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- User-Service: /api/users(...) -> /users(...) ----
        location = /api/users {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://user_service/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/users/ {
            limit_req zone=api_limit burst=20 nodelay;
            # deckt u.a. /api/users/5, /api/users/5/role, /api/users/login ab
            proxy_pass http://user_service/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Intake-Service: nur EIN echter Endpoint -> exact match reicht ----
        location = /api/intake/extract {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://intake_service/intake/extract;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- alles andere geht an das Frontend (statische Dateien der React-App) ---

        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
