services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "29092:29092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=insight-desk
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  postgres-ticket:
    image: postgres:16-alpine
    ports:
      - ${POSTGRES_TICKET_PORT}:5432
    volumes:
      - postgres-ticket-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_TICKET_USER}
      - POSTGRES_PASSWORD=${POSTGRES_TICKET_PASSWORD}
      - POSTGRES_DB=${POSTGRES_TICKET_DB}

  postgres-user:
    image: postgres:16-alpine
    ports:
      - ${POSTGRES_USER_PORT}:5432
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER_DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_USER_DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_USER_DB_NAME}

  ticket-service:
    build:
      context: ./ticket-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-ticket:5432/${POSTGRES_TICKET_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_TICKET_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_TICKET_PASSWORD}
      - USER_SERVICE_BASE_URL=http://user-service:8081
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres-ticket
      - user-service
      - kafka

  user-service:
    build:
      context: ./user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-user:5432/${POSTGRES_USER_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_USER_DB_PASSWORD}
    depends_on:
      - postgres-user

volumes:
  postgres-ticket-data:
  postgres-user-data: