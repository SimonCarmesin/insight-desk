spring.application.name=notification-service
spring.kafka.bootstrap-servers=localhost:29092

user-service.base-url=http://localhost:8081

# Empfaenger fuer die "Ticket abgeschlossen"-Email - bewusst per Env-Variable,
# nicht hardcodiert. Leer lassen = es wird nichts verschickt (nur geloggt).
notification.email.recipient=${NOTIFICATION_EMAIL_RECIPIENT:}

# SMTP-Zugangsdaten fuer den echten Versand. Ohne gesetzte Werte startet der
# Service trotzdem (Default-Host localhost) - der Versand schlaegt dann beim
# Senden fehl und wird nur geloggt, nichts crasht.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
