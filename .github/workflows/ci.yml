        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x user-service/gradlew

      - name: Run tests
        run: ./gradlew test
        working-directory: user-service

  test-notification-service:
    runs-on: ubuntu-latest
    steps:
