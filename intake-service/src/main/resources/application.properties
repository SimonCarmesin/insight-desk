spring.application.name=intake-service
server.port=8082

frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000}

# adesso AI Hub (OpenAI-kompatible Chat-Completions-API, /chat/completions)
# - kein Default fuer Base-URL/Key (siehe .env); ohne gesetzten Key antwortet
# der Service mit 503 statt zu crashen.
ai-hub.base-url=${AI_HUB_BASE_URL:}
ai-hub.api-key=${AI_HUB_API_KEY:}
ai-hub.model=${AI_HUB_MODEL:deepseek-v4-flash-sovereign}
ai-hub.max-completion-tokens=1024
ai-hub.temperature=0.2
